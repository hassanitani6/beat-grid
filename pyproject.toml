[project]
name = "beat-grid"
version = "0.1.0"
description = "Measure a song's beats and bar starts, make click tracks, and get frame-accurate shot lengths for cutting video on the beat."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "numpy>=1.26",
    "soundfile>=0.12",
]
keywords = ["beat-detection", "video-editing", "click-track", "music", "audio", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Sound/Audio :: Analysis"]

[project.scripts]
beat-grid = "beat_grid.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beat_grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
